# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'mrjones2014/smart-splits.nvim'
# resize on Ctrl-Shift-arrows: no Alt key here, plain Ctrl-arrow is
# claimed by macOS Mission Control before it reaches the terminal, and
# Ctrl-Shift-<letter> is indistinguishable from plain Ctrl-<letter> in
# most terminals (set to match nvim's smart-splits.lua)
set -g @smart-splits_resize_left_key  'C-S-Left'
set -g @smart-splits_resize_down_key  'C-S-Down'
set -g @smart-splits_resize_up_key    'C-S-Up'
set -g @smart-splits_resize_right_key 'C-S-Right'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-urlview'

# change default prefix
unbind C-b
set -g prefix C-s
set -g prefix2 "C-'"

# set to vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection     # Begin selection in copy mode.
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle  # Begin selection in copy mode.
bind-key -T copy-mode-vi 'y' send -X copy-selection      # Yank selection in copy mode.

#Disable confirmation to close window 
bind-key x kill-pane

# start tmux at 1
set -g base-index 1
setw -g pane-base-index 1

# open new windows on the same path as the current
bind  `  new-window -c "#{pane_current_path}"
bind  /  split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# renumber windows
set-option -g renumber-windows on

#restart config
bind r source-file $HOME/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "$HOME/.config/tmux/plugins/tpm/tpm"

run "$HOME/.config/tmux/theme.tmux"

set -g status-right '#(gitmux -cfg $HOME/.gitmux.conf "#{pane_current_path}")'

